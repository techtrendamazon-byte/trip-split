<style>
:root{--bg:#eef1f5;--card:#fff;--tx:#0f1b2d;--mut:#66758a;--ac:#0e7c66;--ac2:#14a583;--hd1:#0b2540;--hd2:#14486b;--bd:#e1e6ed;--bad:#c2412d;--badbg:#fbe9e6;--okbg:#e2f5ef;--sh:0 2px 10px rgba(11,37,64,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

body.en nav small,body.en .tl small,body.en .seg small{display:none}.dz{border:1px solid #d9534f55}

<script>
const KEY='trip_hisaba_v1';let LANG='si';try{LANG=localStorage.getItem('trip_lang')||'si'}catch(e){}const BASE='';
let S={pw:'',trip:{name:'',dates:''},hire:0,members:[],exp:[]},VIEW=false;
try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){}
S.veh=S.veh||{owner:'',km:0,rate:0};S.mode=S.mode||(S.hire>0?'hire':'own');
S.done=S.done||{};S.fund=S.fund||{t:'',c:{}};S.w=S.w||{};const FUND='පොදු අරමුදල';const TODAY=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const CATS=['කෑම බීම','ඉන්ධන','කුලිය - අත්තිකාරම','කුලිය - ඉතිරිය','රියදුරු කෑම','නවාතැන්','ටිකට්','අධිවේගී / පාකිං','වෙනත්'];
const ICON={'කෑම බීම':'🍽️','ඉන්ධන':'⛽','කුලිය - අත්තිකාරම':'💵','කුලිය - ඉතිරිය':'🚐','රියදුරු කෑම':'🥘','නවාතැන්':'🏨','ටිකට්':'🎟️','අධිවේගී / පාකිං':'🛣️','වෙනත්':'🧾','වාහන කිමී ගාණ':'🚗'};
const ss=(k,v)=>{try{if(v===undefined)return sessionStorage.getItem(k)||'';sessionStorage.setItem(k,v)}catch(e){return ''}};
let admin=ss('adm')==='1',tab=ss('tab')||'home',modal=null,F={};
const SKEY='trip_sync_v1';
let SY=null,es=null;try{SY=JSON.parse(localStorage.getItem(SKEY)||'null')}catch(e){}
const fb=p=>SY.u.replace(/\/$/,'')+'/trips/'+SY.i+p+'.json';
const norm=o=>{o.members=o.members||[];o.exp=(o.exp||[]).map(e=>({...e,sp:e.sp||[]}));o.trip=o.trip||{name:'',dates:''};o.veh=o.veh||{owner:'',km:0,rate:0};o.hire=o.hire||0;o.mode=o.mode||(o.hire>0?'hire':'own');o.done=o.done||{};o.fund=o.fund||{t:'',c:{}};o.fund.c=o.fund.c||{};o.w=o.w||{};o.lock=!!o.lock;return o};
const strip=o=>{const c={...o};delete c.pw;return c};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'රු. '+Math.round(n).toLocaleString('en-US');
const g=id=>document.getElementById(id);
const toast=m=>{const t=g('toast');if(!t)return;t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2600)};
async function H(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('සුරැකීම අසාර්ථකයි');return false}
  if(SY&&SY.k&&!VIEW){try{const r=await fetch(fb(''),{method:'PATCH',body:JSON.stringify({data:JSON.stringify(strip(S)),k:SY.k})});if(!r.ok)toast('Sync අසාර්ථකයි (අවසර නැත)')}catch(e){toast('Offline: මේ ෆෝන් එකේ සුරැකුවා. Online වුණාම sync වෙනවා')}}
  modal=null;F={};render();return true}
function startSync(){if(!SY)return;if(es)es.close();
  const apply=v=>{if(typeof v!=='string'||JSON.stringify(strip(S))===v)return;try{const o=norm(JSON.parse(v)),pw=S.pw;S=o;S.pw=pw;try{if(!VIEW)localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!modal)render()}catch(e){}};
  es=new EventSource(fb('/data'));
  es.addEventListener('put',ev=>{try{const m=JSON.parse(ev.data);if(m.path==='/')apply(m.data)}catch(e){}})}
async function connectSync(){
  const u=g('su').value.trim().replace(/\/$/,''),p=g('spw').value;let id=g('si').value.trim();
  if(!/^https:\/\/.+/.test(u)||p.length<4){toast('Database URL සහ මුරපදය (අක්ෂර 4+) දාන්න');return}
  if(!id)id=Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join('');
  const k=await H(p+':'+id),old=SY;SY={u,i:id};
  try{const r=await fetch(fb('/data'));if(!r.ok)throw 1;const v=await r.json();
    if(v===null){const w=await fetch(fb(''),{method:'PATCH',body:JSON.stringify({data:JSON.stringify(strip(S)),k})});if(!w.ok)throw 1}
    else{const w=await fetch(fb(''),{method:'PATCH',body:JSON.stringify({k})});if(!w.ok){SY=old;toast('මුරපදය වැරදියි');return}const pw=S.pw;S=norm(JSON.parse(v));S.pw=pw}
  }catch(e){SY=old;toast('සම්බන්ධ වෙන්න බැහැ. URL සහ Rules බලන්න');return}
  SY.k=k;try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}admin=true;ss('adm','1');startSync();await save();toast('Live Sync සම්බන්ධයි ✅')}
addEventListener('online',()=>{if(SY&&SY.k&&!VIEW)save()});
const vehCost=()=>S.mode==='own'?(S.veh.km||0)*(S.veh.rate||0):0;
const allExp=()=>{const c=vehCost();return c>0&&S.members.includes(S.veh.owner)?[...S.exp,{auto:1,cat:'වාහන කිමී ගාණ',desc:S.veh.km+' කිමී × රු. '+S.veh.rate,amt:c,by:S.veh.owner,sp:[...S.members]}]:S.exp};
const sum=c=>S.exp.filter(e=>e.cat===c).reduce((a,e)=>a+e.amt,0);
function calc(){
  const W=m=>S.w[m]===undefined?1:S.w[m];const paid={},owed={};S.members.forEach(m=>{paid[m]=0;owed[m]=0});
  allExp().forEach(e=>{if(e.by in paid)paid[e.by]+=e.amt;const sp=e.sp.filter(x=>x in owed),tw=sp.reduce((a,m)=>a+W(m),0);if(tw>0)sp.forEach(m=>owed[m]+=e.amt*W(m)/tw)});
  const fc=S.fund.c||{};let tc=0;S.members.forEach(m=>{const v=+fc[m]||0;paid[m]+=v;tc+=v});const fe=S.exp.filter(e=>e.by===FUND).reduce((a,e)=>a+e.amt,0);if(S.fund.t in paid)paid[S.fund.t]-=tc-fe;
  const cr=[],db=[],bal={};
  const raw=S.members.map(m=>paid[m]-owed[m]),r=raw.map(Math.round);let df=r.reduce((a,b)=>a+b,0);const od=raw.map((v,i)=>[i,v-r[i]]).sort((a,b)=>df>0?a[1]-b[1]:b[1]-a[1]);
  for(let k=0;df!==0&&k<od.length*5;k++){const i=od[k%od.length][0];r[i]+=df>0?-1:1;df+=df>0?-1:1}
  S.members.forEach((m,i)=>{const v=r[i];bal[m]=v;if(v>0)cr.push([m,v]);else if(v<0)db.push([m,-v])});
  cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
  const pay=[];let i=0,j=0;
  while(i<db.length&&j<cr.length){const x=Math.min(db[i][1],cr[j][1]);pay.push([db[i][0],cr[j][0],x]);db[i][1]-=x;cr[j][1]-=x;if(!db[i][1])i++;if(!cr[j][1])j++}
  return{paid,owed,bal,pay}
}
async function doLogin(){
  const p=g('pw').value;if(p.length<4){toast('අඩුම තරමින් අක්ෂර 4ක් දාන්න');return}
  if(SY){const k=await H(p+':'+SY.i);try{const r=await fetch(fb(''),{method:'PATCH',body:JSON.stringify({k})});if(!r.ok){toast('මුරපදය වැරදියි');return}}catch(e){toast('Network ප්‍රශ්නයක්');return}SY.k=k;try{localStorage.setItem(SKEY,JSON.stringify(SY))}catch(e){}admin=true;ss('adm','1');modal=null;render();toast('Admin ලෙස ඇතුල් වුණා');return}
  const h=await H(p);
  if(!S.pw){S.pw=h;admin=true;ss('adm','1');modal=null;if(!(await save())){render()}}
  else if(h===S.pw){admin=true;ss('adm','1');modal=null;render();toast('Admin ලෙස ඇතුල් වුණා')}
  else toast('මුරපදය වැරදියි')
}
function addExp(){
  const amt=parseFloat(g('fa').value),sp=[...document.querySelectorAll('.spc:checked')].map(x=>x.value);
  if(!amt||amt<=0||!g('fb').value||!sp.length){toast('මුදල, ගෙවූ කෙනා සහ බෙදෙන අය පුරවන්න');return}
  const e={id:F.id||Date.now(),cat:g('fc').value,desc:g('fd').value.trim(),amt,by:g('fb').value,sp,dt:g('fdt').value,ph:F.ph||''};
  if(!F.id&&S.exp.some(x=>x.amt===e.amt&&x.cat===e.cat&&x.dt===e.dt&&x.by===e.by)&&!confirm('මේ වියදම දෙපාරක්ද? එකම ගාණ, කාණ්ඩය, දිනය, ගෙවූ කෙනා දැනටමත් තියෙනවා. එකතු කරන්නද?'))return;
  const i=S.exp.findIndex(x=>x.id===e.id);if(i>=0)S.exp[i]=e;else S.exp.push(e);save()
}
function readCfg(){const v=(id,d)=>g(id)?g(id).value:d;S.trip.name=v('tn',S.trip.name).trim();S.trip.dates=v('td',S.trip.dates).trim();if(g('hh'))S.hire=parseFloat(g('hh').value)||0;if(g('vo'))S.veh={owner:g('vo').value,km:parseFloat(g('vk').value)||0,rate:parseFloat(g('vr').value)||0}}
function setCfg(){readCfg();save().then(()=>toast('සුරැකුවා'))}
function addMember(){const n=g('nm').value.trim();if(!n)return;if(S.members.includes(n)){toast('මේ නම කලින්ම තියෙනවා');return}S.members.push(n);save()}
function delMember(m){if(S.exp.some(e=>e.by===m||e.sp.includes(m))){toast('මේ කෙනාගේ වියදම් තියෙනවා. මුලින් ඒවා මකන්න');return}S.members=S.members.filter(x=>x!==m);save()}
const b64=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function enc(o){let b=new TextEncoder().encode(JSON.stringify(o)),z='p';if(window.CompressionStream){b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());z='z'}return z+b64(b)}
async function dec(s){let b=unb64(s.slice(1));if(s[0]==='z')b=new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());return JSON.parse(new TextDecoder().decode(b))}
async function share(){if(SY){const u=(BASE||location.href.split('#')[0])+'#s='+b64(new TextEncoder().encode(JSON.stringify({u:SY.u,i:SY.i})));modal={t:'share',u,live:1};render();return}

function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='trip-backup.json';a.click()}
function importData(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.members||!o.exp)throw 0;S=o;S.veh=S.veh||{owner:'',km:0,rate:0};S.mode=S.mode||(S.hire>0?'hire':'own');save().then(()=>toast('Backup ඇතුළත් කළා'))}catch(e){toast('වැරදි ෆයිල් එකක්')}};r.readAsText(f)}
document.addEventListener('change',e=>{const t=e.target;if(t.classList.contains('fc')||t.classList.contains('wt')||t.id==='ft'){if(S.lock){toast('🔒 ට්‍රිප් එක වසා ඇත');render();return}if(t.id==='ft')S.fund.t=t.value;else if(t.classList.contains('fc'))S.fund.c[t.dataset.m]=Math.max(0,parseFloat(t.value)||0);else{const v=parseFloat(t.value);S.w[t.dataset.m]=isNaN(v)||v<0?1:v}save();return}if(e.target.id==='fp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);F.ph=c.toDataURL('image/jpeg',.6);g('pv').innerHTML='<img src="'+F.ph+'" style="max-width:100%;border-radius:12px;margin-bottom:10px">'};im.src=r.result};r.readAsDataURL(e.target.files[0])}if(e.target.id==='imp'&&e.target.files[0])importData(e.target.files[0])});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const d=b.dataset,a=d.a;

  else if(a==='add'&&S.lock){toast('🔒 ට්‍රිප් එක වසා ඇත')}
  else if(a==='add'){if(!admin){modal={t:'login'};render();const p=g('pw');if(p)p.focus()}else if(!S.members.length){toast('මුලින් සාමාජිකයන් එකතු කරන්න');tab='cfg';ss('tab',tab);render()}else{F={};modal={t:'exp'};render()}}
  else if(a==='edit'){F=JSON.parse(JSON.stringify(S.exp.find(x=>String(x.id)===d.id)));modal={t:'exp'};render()}
  else if(a==='lock'){S.lock=!S.lock;save()}
  else if(a==='bimg'){modal={t:'img',u:billImg()};render()}
  else if(a==='rmph'){F.ph='';if(g('pv'))g('pv').innerHTML='';if(g('fp'))g('fp').value=''}
  else if(a==='bkp'){const t=JSON.stringify(strip(S));(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('Backup එක copy වුණා. Notes එකක paste කර තියාගන්න')).catch(()=>prompt('මේක copy කරගන්න',t))}
  else if(a==='rst'){const t=prompt('Backup එක paste කරන්න');if(t){try{const o=norm(JSON.parse(t));if(!o.members.length&&!o.exp.length)throw 0;const pw=S.pw;S=o;S.pw=pw;save().then(()=>toast('Restore වුණා'))}catch(e){toast('වැරදි Backup එකක්')}}}
  else if(a==='lang'){LANG=d.l;try{localStorage.setItem('trip_lang',LANG)}catch(e){}render()}
  else if(a==='rtrip'||a==='rall'){modal={t:'reset',k:a};render()}
  else if(a==='resetok')doReset()
  else if(a==='del'){modal={t:'del',id:d.id};render()}
  else if(a==='delok'){S.exp=S.exp.filter(x=>String(x.id)!==d.id);save()}
  else if(a==='saveexp')addExp()
  else if(a==='cfg')setCfg()
  else if(a==='mode'){readCfg();S.mode=d.m;save()}
  else if(a==='addm')addMember()
  else if(a==='delm')delMember(d.m)
  else if(a==='share')share()
  else if(a==='syopen'){modal={t:'sync'};render()}
  else if(a==='syconnect')connectSync()
  else if(a==='syoff'){SY=null;try{localStorage.removeItem(SKEY)}catch(e){}if(es)es.close();es=null;toast('Sync නවත්වලා');render()}
  else if(a==='copy')copyLink()
  else if(a==='ph'){modal={t:'ph',id:d.id};render()}
  else if(a==='done'){S.done[d.k]=!S.done[d.k];save()}
  else if(a==='export')exportData()
  else if(a==='import')g('imp').click()
});
function expRow(e){const n=S.members.length;return `<div class="row"><div class="ic">${ICON[e.cat]||'🧾'}</div><div class="gr"><b>${esc(e.desc||e.cat)}</b><div class="mut">${esc(e.cat)} · ${esc(e.by)} ගෙව්වා · ${e.sp.length===n?'හැමෝටම':esc(e.sp.join(', '))}</div></div><div class="am">${fmt(e.amt)}${e.ph?`<div><button class="s" data-a="ph" data-id="${e.id}">📎</button></div>`:''}${admin&&!S.lock&&!e.auto?`<div><button class="s" data-a="edit" data-id="${e.id}">✏️</button><button class="s" data-a="del" data-id="${e.id}">🗑️</button></div>`:''}</div></div>`}
async function doReset(){const p=g('rp').value;let ok=false;try{ok=SY?(await H(p+':'+SY.i))===SY.k:(await H(p))===S.pw}catch(e){}if(!ok){toast('මුරපදය වැරදියි');return}const k=modal.k;modal=null;const fresh=()=>({pw:'',trip:{name:'',dates:''},hire:0,members:[],exp:[],veh:{owner:'',km:0,rate:0},mode:'hire',done:{},fund:{t:'',c:{}},w:{},lock:false});if(k==='rall'){try{localStorage.removeItem(KEY);localStorage.removeItem(SKEY)}catch(e){}if(es)es.close();es=null;SY=null;S=fresh();admin=false;ss('adm','');tab='home';ss('tab',tab);render();toast('Reset කළා')}else{const pw=S.pw;S=fresh();S.pw=pw;tab='home';ss('tab',tab);await save();toast('Trip එක මැකුවා')}}
function personText(m,c){const b=c.bal[m],mine=c.pay.filter(p=>p[0]===m||p[1]===m).map(p=>p[0]===m?'➡️ '+p[1]+' ට දෙන්න: '+fmt(p[2]):'⬅️ '+p[0]+' ගෙන් ගන්න: '+fmt(p[2])).join('\n');return (S.trip.name||'Trip Split')+'\n👤 '+m+'\nගෙව්වා: '+fmt(c.paid[m])+'\nඔබේ කොටස: '+fmt(c.owed[m])+'\n'+(b>0?'ගන්න ඕන: ':b<0?'දෙන්න ඕන: ':'ශේෂය: ')+fmt(Math.abs(b))+(mine?'\n'+mine:'')+'\n— Rajitha Gaspe'}
function myCard(){const c=calc();return `<div class="card"><h2>👤 එක් එක් අයගේ සාරාංශය</h2>${S.members.length?S.members.map(m=>{const b=c.bal[m];return `<div class="kv"><span><b>${esc(m)}</b><br><span class="mut">ගෙව්වා ${fmt(c.paid[m])} · කොටස ${fmt(c.owed[m])}</span></span><span><b class="${b>=0?'pos':'neg'}">${b>=0?'+':'−'}${fmt(Math.abs(b))}</b> <a class="chip" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(personText(m,c))}">📤</a></span></div>`}).join(''):'<div class="empty">සාමාජිකයන් නැත</div>'}</div>`}
function billImg(){const c=calc(),tot=allExp().reduce((a,e)=>a+e.amt,0),L=[['s','මුළු වියදම: '+fmt(tot)],['h','👤 එක් එක් අය']];S.members.forEach(m=>L.push(['r',m+' · ගෙව්වා '+fmt(c.paid[m])+' · කොටස '+fmt(c.owed[m])]));L.push(['h','💰 කවුද කාට දෙන්නේ']);if(c.pay.length)c.pay.forEach(p=>L.push(['r',p[0]+' → '+p[1]+': '+fmt(p[2])]));else L.push(['r','ගෙවීමට කිසිවක් නැත']);const cv=document.createElement('canvas'),W=900,H=150+L.length*58+90;cv.width=W;cv.height=H;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);const gr=x.createLinearGradient(0,0,W,0);gr.addColorStop(0,'#0b2540');gr.addColorStop(1,'#0e7c66');x.fillStyle=gr;x.fillRect(0,0,W,110);x.fillStyle='#fff';x.font='bold 44px sans-serif';x.fillText(S.trip.name||'Trip Split',40,70);let y=170;L.forEach(l=>{x.fillStyle=l[0]==='h'?'#0e7c66':'#0b2540';x.font=(l[0]==='r'?'30px':'bold 34px')+' sans-serif';x.fillText(l[1],40,y);y+=58});x.fillStyle='#667';x.font='26px sans-serif';x.fillText('ඇප් නිර්මාණය: Rajitha Gaspe',40,H-30);return cv.toDataURL('image/png')}
function expList(ex){if(!ex.length)return '<div class="empty">තවම වියදම් නැත</div>';const m={};ex.forEach(e=>{(m[e.dt||'—']=m[e.dt||'—']||[]).push(e)});return Object.keys(m).sort().reverse().map(d=>`<div class="mut" style="display:flex;justify-content:space-between;margin:12px 0 2px"><b>📅 ${d}</b><b>${fmt(m[d].reduce((a,e)=>a+e.amt,0))}</b></div>`+[...m[d]].reverse().map(expRow).join('')).join('')}

  else if(modal.t==='share')c=`<h3>👁️ බලන ලින්ක් එක</h3><div class="mut" style="margin-bottom:8px">${modal.live?'Live ලින්ක් එක: ඔයා වෙනස් කරන දේවල් යාළුවන්ගේ ෆෝන් එකේ ඉබේම update වෙනවා. එයාලට බලන්න විතරයි පුළුවන්.':'මේ ලින්ක් එක යාළුවන්ට යවන්න. එයාලට බලන්න විතරයි පුළුවන්. දත්ත වෙනස් කළාම අලුත් ලින්ක් එකක් හදලා යවන්න.'}</div><textarea id="lk" readonly rows="5" style="width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:12px">${esc(modal.u)}</textarea><button class="btn w" style="margin-top:10px" data-a="copy">📋 Copy කරන්න</button><a class="btn g wa" href="https://wa.me/?text=${encodeURIComponent(modal.u)}" target="_blank" rel="noopener">WhatsApp එකට යවන්න</a><button class="btn g w" style="margin-top:8px" data-a="close">වසන්න</button>`;
  else if(modal.t==='sync')c=`<h3>☁️ Live Sync සම්බන්ධ කරන්න</h3><label class="l">Firebase Database URL</label><input id="su" placeholder="https://xxxx-default-rtdb.firebasedatabase.app"><label class="l">Trip code (අලුත් trip එකක් නම් හිස්ව තියන්න)</label><input id="si" autocapitalize="none"><label class="l">Admin මුරපදය</label><input id="spw" type="password"><div class="mut" style="margin-bottom:12px">අලුත් trip එකක් නම් දැන් තියෙන දත්ත උඩුගත වෙනවා. තියෙන trip එකකට සම්බන්ධ වුණොත් මේ ෆෝන් එකේ දත්ත ඒකෙන් ප්‍රතිස්ථාපනය වෙනවා.</div><button class="btn w" data-a="syconnect">සම්බන්ධ කරන්න</button><button class="btn g w" style="margin-top:8px" data-a="close">අවලංගු</button>`;
  else if(modal.t==='img')c=`<h3>🖼️ බිල image එක</h3><img src="${modal.u}" style="width:100%;border-radius:12px"><div class="mut" style="margin:8px 0">image එක දිගු වේලාවක් ඔබලා Save කරන්න</div><button class="btn g w" data-a="close">වසන්න</button>`
  else if(modal.t==='reset')c=`<h3>⚠️ ${modal.k==='rall'?'සම්පූර්ණ Reset':'Trip එක මකන්න'}</h3><div class="mut" style="margin-bottom:10px">${modal.k==='rall'?'සියලු දත්ත, මුරපදය සහ sync සැකසුම් මැකෙනවා.':'මේ trip එකේ සියලු දත්ත මැකෙනවා (මුරපදය රැඳේ).'} ආපහු ගන්න බෑ.</div><label class="l">Admin මුරපදය</label><input id="rp" type="password"><button class="btn w" data-a="resetok">මකන්න</button><button class="btn g w" style="margin-top:8px" data-a="close">අවලංගු</button>`

  else c=`<h3>${F.id?'✏️ වියදම edit කරන්න':'➕ අලුත් වියදමක්'}</h3>
  <label class="l">දිනය</label><input id="fdt" type="date" value="${F.dt||TODAY()}"><label class="l">කාණ්ඩය</label><select id="fc">${CATS.map(x=>`<option ${F.cat===x?'selected':''}>${x}</option>`).join('')}</select>

  <label class="l">මුදල (රු.)</label><input id="fa" type="number" inputmode="decimal" value="${F.amt||''}">
  <label class="l">කවුද ගෙව්වේ</label><select id="fb"><option value="">තෝරන්න</option>${S.members.map(m=>`<option ${F.by===m?'selected':''}>${esc(m)}</option>`).join('')}${S.fund.t?`<option ${F.by===FUND?'selected':''}>${FUND}</option>`:''}</select>
  <label class="l">කාටද බෙදෙන්නේ</label><div style="margin-bottom:14px">${S.members.map(m=>`<label class="chk"><input type="checkbox" class="spc" value="${esc(m)}" ${(F.sp?F.sp.includes(m):true)?'checked':''}>${esc(m)}</label>`).join('')}</div>
  <label class="l">බිල්පතේ ෆොටෝ (අවශ්‍ය නම්)</label><input id="fp" type="file" accept="image/*"><div id="pv">${F.ph?`<img src="${F.ph}" style="max-width:100%;border-radius:12px;margin-bottom:10px">`:''}</div><button class="btn g w" style="margin-bottom:10px" data-a="rmph">🗑️ ෆොටෝ ඉවත් කරන්න</button><button class="btn w" data-a="saveexp">${F.id?'යාවත්කාලීන කරන්න':'එකතු කරන්න'}</button><button class="btn g w" style="margin-top:8px" data-a="close">අවලංගු</button>`;
  return `<div class="mb" data-a="close"><div class="sheet" data-a="noop">${c}</div></div>`
}
function menu(){
  const I=[['tab','exp','📋','වියදම්|Expenses'],['tab','bill','💰','ගෙවීම්|Settle Up'],['tab','veh','🚗','වාහනය|Vehicle'],['tab','sum','📊','සාරාංශය|Summary'],['share','','🔗','ලින්ක් එක|Share']];
  if(!VIEW){I.unshift(['add','','🧾','අලුත් වියදම|Add Expense']);I.push(['tab','cfg','⚙️','සැකසුම්|Settings'])}
  return `<div class="menu">${I.map(t=>`<button class="tl" data-a="${t[0]}" data-t="${t[1]}"><span class="e">${t[2]}</span>${t[3].split('|')[0]}<small>${t[3].split('|')[1]||''}</small></button>`).join('')}</div>`
}

    m=vehCard();

    <div class="card"><h2>👥 ශේෂය · Balances</h2>${S.members.map(x=>`<div class="row"><div class="av">${esc(x.slice(0,1))}</div><div class="gr"><b>${esc(x)}</b><div class="mut">ගෙව්වා ${fmt(paid[x])} · වැටෙන්නේ ${fmt(owed[x])}</div></div><span class="pill ${bal[x]>=0?'pos':'neg'}">${bal[x]>=0?'+':'–'}${fmt(Math.abs(bal[x]))}</span></div>`).join('')||'<div class="empty">සාමාජිකයන් නැත</div>'}</div>`;
